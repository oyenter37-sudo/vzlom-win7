name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW (i686 cross compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686

      - name: Build Vzlom.exe (Win32, 32-bit, static)
        run: |
          mkdir -p dist
          i686-w64-mingw32-gcc -std=c99 -O2 -s -municode -mwindows \
            -Wall -Wextra -Wno-unused-parameter \
            -o dist/Vzlom.exe src/vzlom.c -lgdi32 -luser32
          i686-w64-mingw32-strip --strip-all dist/Vzlom.exe
          cd dist && zip -9 Vzlom-win7-x86.zip Vzlom.exe
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vzlom-win7-x86
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Vzlom-win7-x86
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vzlom ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Vzlom.exe
            dist/Vzlom-win7-x86.zip
          generate_release_notes: true
          body: |
            Анимация «Взлом!» для Windows 7 / 8 / 10 / 11 (x86, работает и на x64).

            **Запуск:** распаковать и открыть `Vzlom.exe` (двойной клик).
            32-битный, без зависимостей и установки, не требует .NET / Python / DLL.
