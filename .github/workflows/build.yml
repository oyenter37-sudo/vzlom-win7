name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW (i686 cross compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686

      - name: Build Vzlom.exe (Win32, 32-bit, static)
        run: |
          mkdir -p dist
          i686-w64-mingw32-gcc -std=c99 -O2 -s -municode -mwindows \
            -Wall -Wextra -Wno-unused-parameter \
            -o dist/Vzlom.exe src/vzlom.c -lgdi32 -luser32

      - name: Build Blok.exe (Win32, 32-bit, static)
        run: |
          i686-w64-mingw32-gcc -std=c99 -O2 -s -municode -mwindows \
            -Wall -Wextra -Wno-unused-parameter \
            -o dist/Blok.exe src/blok.c -lgdi32 -luser32

      - name: Strip and pack
        run: |
          i686-w64-mingw32-strip --strip-all dist/Vzlom.exe dist/Blok.exe
          cd dist
          zip -9 Vzlom-win7-x86.zip Vzlom.exe
          zip -9 Blok-win7-x86.zip Blok.exe
          ls -l
          i686-w64-mingw32-objdump -p Blok.exe | grep -i "DLL Name" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prank-win7-x86
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: prank-win7-x86
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Пранки ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Vzlom.exe
            dist/Vzlom-win7-x86.zip
            dist/Blok.exe
            dist/Blok-win7-x86.zip
          generate_release_notes: true
          body: |
            Два полноэкранных прикола для Windows 7 / 8 / 10 / 11 (x86, работают и на x64).

            **Vzlom.exe** — анимация «Взлом!» на 60 секунд (матрица, копирование файлов, вирусы), потом сама закрывается.
            **Blok.exe** — блокировка ввода: клавиатура и мышь не реагируют, курсор дрожит,
            по экрану падают случайные английские буквы. Выход — клавиша **R** (на экране
            она не подсказывается), а если её не нажать, всё разблокируется само через
            **10 минут**. Никакого вреда: только перехват ввода на время показа.

            **Запуск:** распаковать и открыть нужный `.exe` (двойной клик).
            32-битные, без зависимостей и установки, не требуют .NET / Python / DLL.
